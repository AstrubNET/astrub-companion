name: Publier une version
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name AstrubCompanion windows/astrub_companion.py
      - shell: powershell
        run: |
          Copy-Item dist/AstrubCompanion.exe windows/AstrubCompanion.exe
          Compress-Archive -Path windows/*,LICENSE,README.md,PRIVACY.md,SECURITY.md,ARCHITECTURE.md,FAQ.md -DestinationPath Astrub-Companion-Windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: Astrub-Companion-Windows.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Préserver les droits d'exécution macOS
        run: chmod +x macos/*.command macos/*.sh
      - run: zip -r Astrub-Companion-macOS.zip macos LICENSE README.md PRIVACY.md SECURITY.md ARCHITECTURE.md FAQ.md -x '*/__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: Astrub-Companion-macOS.zip
  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lire la version à publier
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Astrub Companion v${{ env.RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*.zip
