name: Publier une version
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name AstrubCompanion windows/astrub_companion.py
      - shell: powershell
        run: |
          Copy-Item dist/AstrubCompanion.exe windows/AstrubCompanion.exe
          Compress-Archive -Path windows/*,LICENSE,README.md,PRIVACY.md,SECURITY.md,ARCHITECTURE.md,FAQ.md -DestinationPath Astrub-Companion-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Astrub-Companion-Windows.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: zip -r Astrub-Companion-macOS.zip macos LICENSE README.md PRIVACY.md SECURITY.md ARCHITECTURE.md FAQ.md -x '*/__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Astrub-Companion-macOS.zip
  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Astrub Companion ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.zip
