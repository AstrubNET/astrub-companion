name: Tests
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m py_compile macos/astrub_companion.py
      - run: bash -n macos/*.command macos/*.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m py_compile windows/astrub_companion.py
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name AstrubCompanion windows/astrub_companion.py
      - uses: actions/upload-artifact@v6
        with:
          name: AstrubCompanion-Windows
          path: dist/AstrubCompanion.exe
